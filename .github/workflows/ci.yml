name: CyberSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend regression contract
        run: node frontend_regression_test.js

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Kubernetes YAML configuration
        run: >-
          ruby -e "require 'yaml'; Dir['kubernetes/*.yaml'].each { |file| YAML.load_stream(File.read(file)); puts \"#{file}: ok\" }"

      - name: Build backend Docker image
        run: docker build --tag cybersentinel-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build --tag cybersentinel-frontend:ci .

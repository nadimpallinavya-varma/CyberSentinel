services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybersentinel
      POSTGRES_USER: cybersentinel
      POSTGRES_PASSWORD: cybersentinel
    volumes: [cybersentinel_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersentinel -d cybersentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cybersentinel:cybersentinel@db:5432/cybersentinel
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: .
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  cybersentinel_pg:

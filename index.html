<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSentinel — Security Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui'],mono:['JetBrains Mono','ui-monospace']},colors:{ink:'#08111f',panel:'#0d1b2e',cyan:'#32d6e9',violet:'#9a7cff',lime:'#b6f36b'}}}};</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{color-scheme:dark} *{box-sizing:border-box} body{margin:0;background:#07101d;color:#dce8f7;font-family:'DM Sans',sans-serif} h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif}.glass{background:linear-gradient(135deg,rgba(17,37,61,.86),rgba(8,20,35,.82));border:1px solid rgba(123,166,207,.15);box-shadow:0 16px 50px rgba(0,0,0,.2)}.grid-bg{background-image:linear-gradient(rgba(70,128,180,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(70,128,180,.055) 1px,transparent 1px);background-size:32px 32px}.glow{box-shadow:0 0 50px rgba(50,214,233,.12)}.nav-active{background:linear-gradient(90deg,rgba(50,214,233,.16),transparent);border-left:2px solid #32d6e9;color:#fff}.pill{border:1px solid rgba(154,124,255,.3);background:rgba(154,124,255,.1)}.bar{height:7px;border-radius:99px;background:#192b42;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#32d6e9,#9a7cff)}.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.scan{position:relative;overflow:hidden}.scan:after{content:'';position:absolute;left:0;right:0;height:1px;top:0;background:#32d6e9;opacity:.35;animation:scan 3s linear infinite}@keyframes scan{to{top:100%}}button{transition:.2s}button:hover{transform:translateY(-1px)}
  </style>
</head>
<body class="grid-bg min-h-screen">
  <div id="app"></div>
  <script>
    const icons=()=>lucide.createIcons();
    const API_BASE=window.CYBERSENTINEL_API||'http://localhost:8000';
    const state={page:'Overview',incidents:[],events:0,assets:0,scenario:'',lastResult:null,toast:'',apiOnline:false};
    const nav=[['Overview','layout-dashboard'],['Detection Center','radar'],['Incidents','shield-alert'],['Assets','server'],['Reports','file-bar-chart-2'],['Admin','settings-2']];
    function shell(content){return `<div class="min-h-screen flex"><aside class="w-64 shrink-0 border-r border-slate-800/80 bg-[#081525] hidden md:flex flex-col"><div class="p-6 flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-cyan-400/15 border border-cyan-300/30 grid place-items-center"><i data-lucide="shield-check" class="w-5 text-cyan-300"></i></div><div><div class="display text-white font-bold tracking-tight">CYBER<span class="text-cyan-300">SENTINEL</span></div><div class="text-[10px] text-slate-500 uppercase tracking-[.22em]">Security operations</div></div></div><div class="px-3 py-3 text-[10px] text-slate-500 uppercase tracking-[.2em]">Workspace</div><nav class="px-3 space-y-1">${nav.map(([n,ic])=>`<button onclick="go('${n}')" class="w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm ${state.page===n?'nav-active':'text-slate-400 hover:bg-slate-800/50 hover:text-white'}"><i data-lucide="${ic}" class="w-4"></i>${n}${n==='Incidents'?`<span class="ml-auto text-xs bg-red-400/15 text-red-300 px-2 py-0.5 rounded-full">${state.incidents.length}</span>`:''}</button>`).join('')}</nav><div class="mt-auto p-4"><div class="glass rounded-xl p-4"><div class="flex items-center justify-between mb-2"><span class="text-xs text-slate-400">System health</span><span class="w-2 h-2 rounded-full bg-lime-300 shadow-[0_0_10px_#b6f36b]"></span></div><div class="text-lg font-semibold">Operational</div><div class="text-xs text-slate-500 mt-1">Last checked just now</div></div><div class="flex items-center gap-3 mt-5 px-2"><div class="w-8 h-8 rounded-full bg-violet-400/20 grid place-items-center text-violet-200 text-xs font-bold">AR</div><div><div class="text-sm">Alex Rivera</div><div class="text-xs text-slate-500">Security analyst</div></div><i data-lucide="chevrons-up-down" class="w-4 text-slate-500 ml-auto"></i></div></div></aside><main class="flex-1 min-w-0"><header class="h-16 border-b border-slate-800/80 bg-[#081525]/80 backdrop-blur flex items-center justify-between px-5 md:px-8"><div class="flex items-center gap-3"><button class="md:hidden text-slate-400" onclick="alert('Use a desktop viewport for the full navigation.')"><i data-lucide="menu"></i></button><span class="text-sm text-slate-500">Workspace /</span><span class="text-sm">${state.page}</span></div><div class="flex items-center gap-4"><span class="hidden sm:flex items-center gap-2 text-xs text-slate-400"><span class="w-2 h-2 rounded-full bg-lime-300"></span> Live telemetry</span><button class="text-slate-400 hover:text-white"><i data-lucide="bell" class="w-4"></i></button><button class="rounded-lg border border-cyan-300/25 bg-cyan-300/10 text-cyan-200 px-3 py-2 text-xs font-medium" onclick="toast('Demo workspace is already active')"><i data-lucide="flask-conical" class="w-3 inline mr-1"></i> Demo mode</button></div></header><div class="p-5 md:p-8 max-w-[1500px] mx-auto">${content}</div></main></div>${state.toast?`<div class="fixed bottom-6 right-6 glass px-4 py-3 rounded-xl text-sm text-cyan-100 fade">${state.toast}</div>`:''}`}
    async function api(path, options={}){let r=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw new Error(await r.text());return r.json()}
    async function refreshData(){try{let [stats, incidents]=await Promise.all([api('/api/stats'),api('/api/incidents')]);state.events=stats.events;state.assets=stats.assets;state.incidents=incidents.map(x=>({...x,time:new Date(x.created_at).toLocaleString(),asset:'Asset #'+x.asset_id,source:x.source_ip,severity:x.severity.charAt(0).toUpperCase()+x.severity.slice(1),status:x.status.charAt(0).toUpperCase()+x.status.slice(1)}));state.apiOnline=true}catch(e){state.apiOnline=false}}
    function go(p){state.page=p;state.toast='';render()} function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},2200)}
    function overview(){return `<div class="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-8"><div><div class="flex items-center gap-2 text-xs text-cyan-300 mb-3"><span class="w-2 h-2 rounded-full bg-cyan-300"></span> THREAT OPERATIONS CENTER</div><h1 class="text-3xl md:text-4xl font-semibold text-white tracking-tight">Good morning, Alex.</h1><p class="text-slate-400 mt-2">Here’s your security posture across the organization.</p></div><div class="flex gap-3"><button class="border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-300" onclick="go('Reports')"><i data-lucide="download" class="w-4 inline mr-2"></i>Export report</button><button class="bg-cyan-300 text-[#06121e] rounded-lg px-4 py-2 text-sm font-semibold" onclick="go('Detection Center')"><i data-lucide="scan-line" class="w-4 inline mr-2"></i>Run detection</button></div></div><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">${metric('Security events','1,284','+18.4%','up','activity','cyan')}${metric('Active incidents','03','2 critical','down','shield-alert','red')}${metric('Protected assets','12','100% healthy','up','server','violet')}${metric('Mean response time','08m 42s','-21.8% this week','up','timer','lime')}</div><div class="grid grid-cols-1 xl:grid-cols-3 gap-5"><div class="glass rounded-2xl p-5 xl:col-span-2"><div class="flex items-start justify-between mb-5"><div><h2 class="text-lg font-semibold text-white">Threat activity</h2><p class="text-xs text-slate-500 mt-1">Events ingested over the last 24 hours</p></div><div class="flex gap-2 text-[11px] text-slate-400"><span><i class="inline-block w-2 h-2 rounded-full bg-cyan-300 mr-1"></i>Events</span><span><i class="inline-block w-2 h-2 rounded-full bg-violet-300 mr-1"></i>Incidents</span></div></div>${chart()}</div><div class="glass rounded-2xl p-5"><div class="flex justify-between items-center mb-5"><div><h2 class="text-lg font-semibold text-white">Severity mix</h2><p class="text-xs text-slate-500 mt-1">Current open queue</p></div><i data-lucide="pie-chart" class="w-4 text-slate-500"></i></div><div class="flex items-center gap-6"><div class="relative w-32 h-32 rounded-full" style="background:conic-gradient(#ff5d6c 0 14%,#ffb454 14% 38%,#b6f36b 38% 60%,#53667d 60% 100%)"><div class="absolute inset-5 bg-[#102039] rounded-full grid place-items-center"><div class="text-center"><div class="text-2xl font-semibold text-white">03</div><div class="text-[10px] text-slate-500">OPEN</div></div></div></div><div class="space-y-3 text-xs flex-1">${[['Critical','#ff5d6c','01'],['High','#ffb454','01'],['Medium','#b6f36b','01'],['Low','#53667d','00']].map(x=>`<div class="flex items-center justify-between"><span class="flex items-center gap-2"><i class="w-2 h-2 rounded-full" style="background:${x[1]}"></i>${x[0]}</span><span class="text-slate-300">${x[2]}</span></div>`).join('')}</div></div></div></div><div class="grid grid-cols-1 xl:grid-cols-5 gap-5 mt-5"><div class="glass rounded-2xl p-5 xl:col-span-3"><div class="flex justify-between mb-4"><div><h2 class="text-lg font-semibold text-white">Recent incidents</h2><p class="text-xs text-slate-500 mt-1">Prioritized by detection confidence</p></div><button class="text-xs text-cyan-300" onclick="go('Incidents')">View all <i data-lucide="arrow-up-right" class="w-3 inline"></i></button></div>${state.incidents.map(incidentRow).join('')}</div><div class="glass rounded-2xl p-5 xl:col-span-2"><div class="flex justify-between mb-4"><div><h2 class="text-lg font-semibold text-white">Monitored assets</h2><p class="text-xs text-slate-500 mt-1">Healthy: 12 / 12</p></div><button onclick="go('Assets')" class="text-slate-500"><i data-lucide="external-link" class="w-4"></i></button></div>${[['Customer Portal','Web application','99.98%','#b6f36b'],['Admin Console','Internal service','100%','#b6f36b'],['API Gateway','Edge endpoint','99.91%','#b6f36b'],['Auth Service','Identity provider','99.99%','#b6f36b']].map(a=>`<div class="flex items-center gap-3 py-3 border-b border-slate-800/70 last:border-0"><div class="w-8 h-8 rounded-lg bg-slate-800 grid place-items-center"><i data-lucide="box" class="w-4 text-slate-400"></i></div><div class="flex-1"><div class="text-sm text-slate-200">${a[0]}</div><div class="text-xs text-slate-500">${a[1]}</div></div><div class="text-right"><div class="text-xs text-lime-300">${a[3]}</div><div class="text-[10px] text-slate-500">${a[2]}</div></div></div>`).join('')}</div></div>`}
    function metric(a,b,c,trend,ic,color){return `<div class="glass rounded-2xl p-5 glow"><div class="flex justify-between items-start"><span class="text-sm text-slate-400">${a}</span><span class="w-8 h-8 rounded-lg bg-${color}-300/10 grid place-items-center"><i data-lucide="${ic}" class="w-4 text-${color}-300"></i></span></div><div class="text-3xl font-semibold text-white mt-4">${b}</div><div class="text-xs mt-2 ${trend==='down'?'text-red-300':'text-lime-300'}"><i data-lucide="trending-${trend}" class="w-3 inline mr-1"></i>${c}</div></div>`}
    function chart(){let vals=[28,36,31,48,42,55,47,62,58,81,65,72,60,84,68,91,78,65,80,72,96,86,75,89];return `<div class="h-52 flex items-end gap-2 pt-5">${vals.map((v,i)=>`<div class="flex-1 h-full flex items-end gap-[2px]" title="${i}:00"><i class="w-1/2 rounded-t bg-cyan-300/70" style="height:${v}%"></i><i class="w-1/2 rounded-t bg-violet-300/60" style="height:${Math.max(6,v/3)}%"></i></div>`).join('')}</div><div class="flex justify-between text-[10px] text-slate-600 mt-2"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>Now</span></div>`}
    function incidentRow(x){let c=x.severity==='Critical'?'red':x.severity==='High'?'orange':'lime';return `<button onclick="openIncident('${x.id}')" class="w-full text-left flex items-center gap-3 py-3 border-b border-slate-800/70 last:border-0 hover:bg-white/[.02] rounded-lg px-2"><div class="w-9 h-9 rounded-xl bg-${c}-300/10 grid place-items-center"><i data-lucide="shield-alert" class="w-4 text-${c}-300"></i></div><div class="flex-1 min-w-0"><div class="text-sm text-slate-200 truncate">${x.title}</div><div class="text-xs text-slate-500 mt-1">${x.id} · ${x.asset}</div></div><div class="text-right"><div class="text-[10px] uppercase tracking-wide text-${c}-300">${x.severity}</div><div class="text-[10px] text-slate-600 mt-1">${x.time}</div></div></button>`}
    function detection(){return `<div class="mb-8"><div class="text-xs text-cyan-300 mb-3">DETECTION CENTER</div><h1 class="text-3xl font-semibold text-white">Test your defenses</h1><p class="text-slate-400 mt-2 max-w-2xl">Analyze authentication telemetry with explainable rules. Use a local scenario to see how CyberSentinel preserves evidence and creates incidents.</p></div><div class="grid grid-cols-1 xl:grid-cols-5 gap-5"><div class="glass rounded-2xl p-6 xl:col-span-2 scan"><div class="flex items-center gap-3 mb-6"><div class="w-10 h-10 rounded-xl bg-cyan-300/10 grid place-items-center"><i data-lucide="radar" class="text-cyan-300"></i></div><div><h2 class="font-semibold text-white">Local demo scenarios</h2><p class="text-xs text-slate-500">Authorized test assets only</p></div></div><div class="space-y-3">${[['Normal login activity','Baseline behavior','user login · low risk','normal'],['Repeated failed logins','Brute-force heuristic','12 failures in 60 seconds','brute'],['Authentication burst','Velocity anomaly','24 attempts from one IP','burst'],['Success after failures','Account takeover signal','success after 8 failures','success']].map(s=>`<button onclick="runScenario('${s[3]}')" class="w-full text-left border border-slate-700/70 hover:border-cyan-300/50 rounded-xl p-4"><div class="flex justify-between"><span class="text-sm text-slate-200">${s[0]}</span><i data-lucide="play-circle" class="w-4 text-cyan-300"></i></div><div class="text-xs text-slate-500 mt-2">${s[1]} · ${s[2]}</div></button>`).join('')}</div><div class="mt-6 p-3 rounded-lg bg-amber-300/5 border border-amber-300/15 text-xs text-amber-200/80"><i data-lucide="info" class="w-3 inline mr-1"></i> Simulation data is isolated from production telemetry.</div></div><div class="glass rounded-2xl p-6 xl:col-span-3"><div class="flex justify-between items-start"><div><h2 class="font-semibold text-white">Analysis output</h2><p class="text-xs text-slate-500 mt-1">Rule engine results appear here</p></div><span class="pill rounded-full px-3 py-1 text-[10px] text-violet-200">RULE-BASED</span></div>${state.scenario?scenarioOutput():`<div class="h-80 grid place-items-center text-center"><div><div class="w-16 h-16 rounded-full bg-slate-800/80 grid place-items-center mx-auto mb-4"><i data-lucide="scan-search" class="w-7 text-slate-500"></i></div><div class="text-slate-300">No analysis run yet</div><div class="text-xs text-slate-600 mt-2">Choose a scenario to generate explainable telemetry</div></div></div>`}</div></div>`}
    function scenarioOutput(){if(state.scenario==='loading')return `<div class="h-80 grid place-items-center text-cyan-200"><div class="text-center"><i data-lucide="loader-circle" class="w-8 animate-spin mx-auto mb-3"></i><div>Sending synthetic events to FastAPI…</div></div></div>`;let d={normal:['No suspicious activity','Low','All events matched baseline behavior.','1 successful login'],brute:['Repeated failed-login pattern','High','Repeated failures exceeded the configured threshold.','5 failed logins · 1 source IP'],burst:['Suspicious authentication burst','High','Authentication velocity exceeded the configured burst threshold.','10 events · 10 identities · 90 sec'],success:['Successful login after failures','Critical','A successful login followed repeated failures for the same identity.','5 failures → 1 success · admin@demo.local']}[state.scenario];let col=d[1]==='Critical'?'red':d[1]==='High'?'orange':'lime';let rule=state.lastResult?.incidents?.[0]?.detection_rule||'NO-DETECTION';let evidence=state.lastResult?.incidents?.[0]?.evidence?.explanation||d[2];return `<div class="mt-8 fade"><div class="flex items-center gap-4 p-4 rounded-xl bg-${col}-300/10 border border-${col}-300/20"><div class="w-11 h-11 rounded-full bg-${col}-300/15 grid place-items-center"><i data-lucide="${d[1]==='Low'?'check-circle-2':'triangle-alert'}" class="text-${col}-300"></i></div><div class="flex-1"><div class="text-xs uppercase tracking-widest text-${col}-300">${d[1]} · ${d[0]}</div><div class="text-sm text-slate-200 mt-1">Backend rule result <span class="text-white font-semibold">${rule}</span></div></div><span class="text-xs text-slate-500">${state.lastResult?.events_created||0} events stored</span></div><div class="mt-5"><div class="text-xs text-slate-500 uppercase tracking-widest mb-3">Evidence preserved in database</div><div class="grid grid-cols-2 gap-3">${[['Rule',rule],['Finding',evidence],['Telemetry',d[3]],['Source','192.0.2.44 (TEST-NET)']].map(x=>`<div class="rounded-lg bg-[#091729] p-3"><div class="text-[10px] text-slate-600 uppercase">${x[0]}</div><div class="text-sm text-slate-300 mt-1">${x[1]}</div></div>`).join('')}</div></div><button onclick="go('Incidents')" class="mt-5 bg-cyan-300 text-[#06121e] rounded-lg px-4 py-2 text-sm font-semibold">Investigate incident <i data-lucide="arrow-right" class="w-4 inline ml-1"></i></button></div>`}
    async function runScenario(s){state.scenario='loading';state.lastResult=null;render();const endpoint=s==='brute'?'brute_force':s==='success'?'success_after_failures':s;try{const result=await api('/api/demo/'+endpoint,{method:'POST'});state.lastResult=result;await refreshData();state.scenario=s;toast(result.incidents.length?'Backend detection created an incident':'Events processed: no rule triggered')}catch(e){state.scenario='';const message=e.name==='TypeError'?'Cannot reach the CyberSentinel API at '+API_BASE+'. Check that the backend container is running.':e.message.includes('404')?'The demo endpoint was not found: POST /api/demo/'+endpoint:e.message.includes('500')?'The backend rejected the scenario. Check the API logs.':'Scenario request failed: '+e.message;toast(message)}render()}
    function createIncident(){toast('Incidents are created by the backend detection engine. Use a demo scenario.');}
    function incidents(){return `<div class="flex justify-between items-end mb-8"><div><div class="text-xs text-cyan-300 mb-3">INCIDENT MANAGEMENT</div><h1 class="text-3xl font-semibold text-white">Investigation queue</h1><p class="text-slate-400 mt-2">Triage suspicious activity with an auditable response workflow.</p></div><button onclick="go('Detection Center')" class="bg-cyan-300 text-[#06121e] rounded-lg px-4 py-2 text-sm font-semibold">+ New analysis</button></div><div class="glass rounded-2xl overflow-hidden"><div class="p-5 border-b border-slate-800 flex justify-between"><div class="text-sm text-slate-300">${state.incidents.length} incidents in workspace</div><div class="text-xs text-slate-500">Sorted by newest</div></div>${state.incidents.map(x=>`<button onclick="openIncident('${x.id}')" class="w-full text-left p-5 border-b border-slate-800/70 hover:bg-white/[.02] flex flex-col md:flex-row md:items-center gap-4"><div class="w-10 h-10 rounded-xl bg-red-300/10 grid place-items-center"><i data-lucide="shield-alert" class="w-5 text-red-300"></i></div><div class="flex-1"><div class="text-white">${x.title}</div><div class="text-xs text-slate-500 mt-1">${x.id} · ${x.asset} · ${x.source}</div></div><span class="text-xs rounded-full px-3 py-1 bg-${x.severity==='Critical'?'red':'orange'}-300/10 text-${x.severity==='Critical'?'red':'orange'}-300">${x.severity}</span><span class="text-xs text-slate-500">${x.status}</span><i data-lucide="chevron-right" class="w-4 text-slate-600"></i></button>`).join('')}</div>`}
    function openIncident(id){let x=state.incidents.find(a=>a.id===id);if(!x)return;document.querySelector('#app').innerHTML=shell(`<button onclick="go('Incidents')" class="text-xs text-slate-500 mb-6"><i data-lucide="arrow-left" class="w-3 inline mr-1"></i>Back to queue</button><div class="flex flex-col lg:flex-row justify-between gap-5 mb-7"><div><div class="flex gap-2 items-center mb-3"><span class="text-xs text-red-300 uppercase tracking-widest">${x.severity} priority</span><span class="text-xs text-slate-600">·</span><span class="text-xs text-slate-500">${x.id}</span></div><h1 class="text-3xl font-semibold text-white">${x.title}</h1><p class="text-slate-400 mt-2">Evidence-led investigation for ${x.asset}.</p></div><div class="flex gap-3"><button class="border border-slate-700 rounded-lg px-4 py-2 text-sm" onclick="toast('Analyst acknowledgment recorded')">Acknowledge</button><button class="bg-lime-300 text-[#07101d] rounded-lg px-4 py-2 text-sm font-semibold" onclick="resolveIncident('${x.id}')">Mark resolved</button></div></div><div class="grid grid-cols-1 xl:grid-cols-3 gap-5"><div class="glass rounded-2xl p-5 xl:col-span-2"><h2 class="font-semibold text-white mb-5">Investigation timeline</h2>${[['09:41:02','Failed authentication','admin@northstar.io','Source IP '+x.source],['09:41:18','Failed authentication','admin@northstar.io','Same source fingerprint'],['09:41:45','Detection rule matched','AUTH-FAILURE-SEQUENCE','Confidence 96%'],['09:42:03','Incident created','CyberSentinel rule engine','Evidence hash preserved']].map((e,i)=>`<div class="flex gap-4 pb-6 relative"><div class="w-2 h-2 rounded-full ${i===3?'bg-violet-300':'bg-cyan-300'} mt-2 z-10"></div><div class="absolute left-[3px] top-4 bottom-0 w-px bg-slate-700 last:hidden"></div><div><div class="text-[11px] font-mono text-slate-500">${e[0]}</div><div class="text-sm text-slate-200 mt-1">${e[1]}</div><div class="text-xs text-slate-500 mt-1">${e[2]} · ${e[3]}</div></div></div>`).join('')}</div><div class="space-y-5"><div class="glass rounded-2xl p-5"><h2 class="font-semibold text-white mb-4">Incident context</h2>${[['Asset',x.asset],['Source IP',x.source],['Detection rule','AUTH-FAILURE-SEQUENCE'],['Status',x.status]].map(a=>`<div class="flex justify-between py-3 border-b border-slate-800/70 last:border-0 text-sm"><span class="text-slate-500">${a[0]}</span><span class="text-slate-200 text-right">${a[1]}</span></div>`).join('')}</div><div class="glass rounded-2xl p-5"><h2 class="font-semibold text-white mb-3">Recommended response</h2><p class="text-sm text-slate-400 leading-relaxed">Require step-up authentication, review affected sessions, and rotate credentials if compromise is confirmed. Automatic containment is simulated.</p><div class="mt-4 text-xs text-amber-200/80 bg-amber-300/5 border border-amber-300/15 rounded-lg p-3"><i data-lucide="lock" class="w-3 inline mr-1"></i>No external infrastructure was modified.</div></div></div></div>`);icons()}
    function resolveIncident(id){let x=state.incidents.find(a=>a.id===id);if(x)x.status='Resolved';toast('Incident marked resolved');go('Incidents')}
    function generic(title,sub,body){return `<div class="mb-8"><div class="text-xs text-cyan-300 mb-3">${title.toUpperCase()}</div><h1 class="text-3xl font-semibold text-white">${title}</h1><p class="text-slate-400 mt-2">${sub}</p></div>${body}`}
    function simplePage(){let p=state.page;if(p==='Assets')return generic('Monitored assets','Keep visibility on every application and service connected to your security perimeter.',`<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${['Customer Portal','Admin Console','API Gateway','Auth Service','Billing Worker','Support Desk'].map((x,i)=>`<div class="glass rounded-2xl p-5"><div class="flex justify-between"><div class="w-10 h-10 rounded-xl bg-cyan-300/10 grid place-items-center"><i data-lucide="server" class="text-cyan-300"></i></div><span class="text-xs text-lime-300">● Healthy</span></div><h2 class="text-white mt-5">${x}</h2><p class="text-xs text-slate-500 mt-1">${i%2?'Internal service':'Web application'} · monitored</p><div class="bar mt-5"><i style="width:${98+i%3*.5}%"></i></div><div class="flex justify-between text-[11px] text-slate-500 mt-2"><span>Uptime</span><span>99.${98-i}8%</span></div></div>`).join('')}</div>`);if(p==='Reports')return generic('Security reports','Turn detection telemetry into an evidence-backed view for your team.',`<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">${[['Weekly posture report','PDF','Oct 07–14, 2026'],['Incident export','JSON','3 incidents'],['Threat trend summary','PDF','Last 30 days']].map(x=>`<div class="glass rounded-2xl p-5"><div class="flex justify-between"><i data-lucide="file-text" class="text-violet-300"></i><span class="text-xs pill rounded px-2 py-1 text-violet-200">${x[1]}</span></div><h2 class="text-white mt-5">${x[0]}</h2><p class="text-xs text-slate-500 mt-1">${x[2]}</p><button onclick="toast('Report download prepared')" class="mt-5 text-xs text-cyan-300">Download report <i data-lucide="download" class="w-3 inline"></i></button></div>`).join('')}</div><div class="glass rounded-2xl p-6"><h2 class="text-white mb-4">30-day threat trend</h2>${chart()}</div>`);return generic('Admin controls','Manage access, thresholds, and the audit trail for this workspace.',`<div class="grid grid-cols-1 xl:grid-cols-2 gap-5"><div class="glass rounded-2xl p-6"><h2 class="text-white mb-5">Detection thresholds</h2>${[['Failed logins per minute','12'],['Burst window (seconds)','90'],['Deduplication window (minutes)','15']].map(x=>`<label class="block mb-4"><span class="text-xs text-slate-400">${x[0]}</span><input value="${x[1]}" class="w-full mt-2 rounded-lg bg-[#081525] border border-slate-700 px-3 py-2 text-sm text-white" /></label>`).join('')}<button onclick="toast('Threshold configuration saved')" class="bg-cyan-300 text-[#06121e] rounded-lg px-4 py-2 text-sm font-semibold">Save configuration</button></div><div class="glass rounded-2xl p-6"><h2 class="text-white mb-5">Recent audit activity</h2>${['Alex Rivera acknowledged INC-1047','Rule AUTH-VELOCITY configuration updated','Demo asset Auth Service registered','Report exported as JSON'].map((x,i)=>`<div class="flex gap-3 py-3 border-b border-slate-800/70 last:border-0"><i data-lucide="history" class="w-4 text-slate-500"></i><div><div class="text-sm text-slate-300">${x}</div><div class="text-xs text-slate-600 mt-1">${i+1} hour${i?'s':''} ago</div></div></div>`).join('')}</div></div>`)}
    async function render(){let c=state.page==='Overview'?overview():state.page==='Detection Center'?detection():state.page==='Incidents'?incidents():simplePage();document.querySelector('#app').innerHTML=shell(c);icons();if(!state.apiOnline){await refreshData();if(state.apiOnline){let next=state.page==='Overview'?overview():state.page==='Incidents'?incidents():simplePage();document.querySelector('#app').innerHTML=shell(next);icons()}}}
    render();
  </script>
</body>
</html>
